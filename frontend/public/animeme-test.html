<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animeme API Tester</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0c111b;
        color: #edf2f7;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 720px);
        padding: clamp(20px, 5vw, 40px);
        border: 1px solid #293449;
        border-radius: 20px;
        background: #131b29;
        box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
      }

      h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 5vw, 2.2rem); }
      p { color: #aab6c8; line-height: 1.55; }

      form {
        display: flex;
        gap: 10px;
        margin: 24px 0;
      }

      input, button {
        min-height: 46px;
        border-radius: 10px;
        font: inherit;
      }

      input {
        min-width: 0;
        flex: 1;
        padding: 0 14px;
        border: 1px solid #34435d;
        background: #0c111b;
        color: inherit;
      }

      button {
        padding: 0 18px;
        border: 0;
        background: #6d5dfc;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled { cursor: wait; opacity: 0.65; }

      #status { min-height: 24px; margin: 0 0 14px; }
      #status.error { color: #ff8585; }
      #status.success { color: #70e1a1; }

      #meme {
        display: none;
        width: 100%;
        max-height: 500px;
        object-fit: contain;
        border-radius: 12px;
        background: #090d14;
      }

      pre {
        overflow: auto;
        padding: 16px;
        border-radius: 12px;
        background: #090d14;
        color: #c8d5ea;
        white-space: pre-wrap;
        word-break: break-word;
      }

      @media (max-width: 560px) {
        form { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Animeme API Tester</h1>
      <p>Enter any compatible endpoint, then fetch one random meme.</p>

      <form id="tester">
        <input
          id="endpoint"
          type="url"
          value="https://meme-api.com/gimme/Animemes"
          aria-label="API endpoint"
          required
        />
        <button id="fetch-button" type="submit">Fetch meme</button>
      </form>

      <p id="status" aria-live="polite">Ready to test.</p>
      <img id="meme" alt="Meme returned by the API" />
      <pre id="response">No response yet.</pre>
    </main>

    <script>
      const form = document.querySelector('#tester')
      const endpoint = document.querySelector('#endpoint')
      const button = document.querySelector('#fetch-button')
      const status = document.querySelector('#status')
      const responseOutput = document.querySelector('#response')
      const meme = document.querySelector('#meme')

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        button.disabled = true
        status.className = ''
        status.textContent = 'Requesting meme…'
        responseOutput.textContent = 'Waiting for response…'
        meme.style.display = 'none'
        meme.removeAttribute('src')

        try {
          const response = await fetch(endpoint.value.trim())
          const bodyText = await response.text()
          let data

          try {
            data = JSON.parse(bodyText)
          } catch {
            data = bodyText
          }

          responseOutput.textContent =
            typeof data === 'string' ? data : JSON.stringify(data, null, 2)

          if (!response.ok) {
            throw new Error(`HTTP ${response.status} ${response.statusText}`)
          }

          status.className = 'success'
          status.textContent = `Success: HTTP ${response.status}`

          if (data && typeof data === 'object' && data.url) {
            meme.src = data.url
            meme.alt = data.title || 'Meme returned by the API'
            meme.style.display = 'block'
          }
        } catch (error) {
          status.className = 'error'
          status.textContent = `Request failed: ${error.message}. The server may be offline or blocking browser requests with CORS.`
        } finally {
          button.disabled = false
        }
      })
    </script>
  </body>
</html>
